{% extends "base.html" %}

{% block content %}

  <!-- Navigation Bar -->
  <header class="border-bottom">
    <div class="container-fluid px-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between py-2">
        
        <!-- Left Side: Logo & Links -->
        <div class="d-flex align-items-center gap-4">
          <a href="#" class="logo-text me-2">JobPortal</a>
          <ul class="nav">
            <li class="nav-item"><a href="#" class="nav-link active me-2">Home</a></li>
          </ul>
        </div>

        <!-- Right Side: Sign in & Employer Options -->
        <div class="d-flex align-items-center gap-3">
          <a href="{% url 'signin' %}" class="text-primary fw-bold text-decoration-none">Sign in</a>
          <span class="text-muted small">|</span>
          <span class="text-muted small">|</span>
          <a href="{% url 'signup' %}" class="text-primary fw-bold text-decoration-none">Sign up</a>
          <span class="text-muted small">us <span class="fw-bold text-dark">En</span></span>
          <span class="text-muted small">|</span>
          <a href="#" class="text-dark text-decoration-none small fw-semibold">Employers / Post Job</a>
        </div>
        
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container my-5">
    
    <!-- Top Search Bar Section -->
    <div class="search-box bg-white d-flex align-items-center mb-5">
      
      <!-- Input 1: Job Title / Keywords -->
      <div class="input-group search-input-group px-2">
        <span class="input-group-text bg-transparent border-0 pe-2">
          <i class="bi bi-search text-dark fs-5"></i>
        </span>
        <input type="text" class="form-control" placeholder="Job title, keywords, or company">
      </div>

      <!-- Vertical Divider -->
      <div class="divider align-self-stretch"></div>

      <!-- Input 2: Location -->
      <div class="input-group search-input-group px-2">
        <span class="input-group-text bg-transparent border-0 pe-2">
          <i class="bi bi-geo-alt text-dark fs-5"></i>
        </span>
        <input type="text" class="form-control" placeholder="Remote" value="Remote">
      </div>

      <!-- Search Button -->
      <button class="btn btn-search text-nowrap ms-2" type="button">Search</button>
    </div>

    <!-- Center Hero Section -->
    <div class="text-center mt-5 pt-3">
      <div class="center-logo mb-1">
        <i class="bi bi-info-circle-fill fs-3 align-top me-0" style="color: #2557a7;"></i>JobPortal
      </div>
      
      <h2 class="fw-bold mb-3" style="font-size: 1.8rem; color: #2d2d2d;">
        Your next job starts here
      </h2>
      
      <p class="text-secondary mb-4">
        Create an account or sign in to see your personalized job recommendations.
      </p>

      <a href="{% url 'signin' %}" class="btn btn-get-started d-inline-flex align-items-center gap-2 text-decoration-none">
        Get Started <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </main>

  <!-- Footer Trending Section -->
  <footer class="text-center fixed-bottom pb-4 bg-white">
    <a href="#" class="text-dark text-decoration-none small fw-semibold">
      What's trending on JobPortal <i class="bi bi-chevron-down ms-1"></i>
    </a>
  </footer>

  <!-- Bootstrap JS (Optional for components, but included for complete setup) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  {% endblock %}

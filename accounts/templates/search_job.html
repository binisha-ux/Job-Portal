{% extends "base.html" %}

{% block content %}


        
<main class="container my-5">

  <!-- Search Form -->
  <form action="{% url 'search_jobs' %}" method="GET">
    <div class="search-box bg-white d-flex align-items-center mb-4 border rounded-pill p-2 shadow-sm">
      
      <!-- Input 1: Keyword/Title -->
      <div class="input-group px-2">
        <span class="input-group-text bg-transparent border-0 pe-2">
          <i class="bi bi-search text-dark fs-5"></i>
        </span>
        <input type="text" name="q" class="form-control border-0 shadow-none" placeholder="Job title, keywords, or company" value="{{ query|default:'' }}">
      </div>

      <!-- Divider -->
      <div class="divider align-self-stretch border-end"></div>

      <!-- Input 2: Location -->
      <div class="input-group px-2">
        <span class="input-group-text bg-transparent border-0 pe-2">
          <i class="bi bi-geo-alt text-dark fs-5"></i>
        </span>
        <input type="text" name="location" class="form-control border-0 shadow-none" placeholder="Location or Remote" value="{{ location|default:'' }}">
      </div>

      <!-- Submit Button -->
      <button class="btn btn-primary rounded-pill px-4 ms-2" type="submit">Search</button>
    </div>
  </form>

  <!-- Job Results List -->
  <div class="job-list">
    {% for job in jobs %}
      <div class="card mb-3 p-3 shadow-sm border-0">
        <h3 class="h5 mb-1">{{ job.title }}</h3>
        <p class="text-secondary mb-0">{{ job.company_name }} — {{ job.location }}</p>
      </div>
    {% empty %}
      <div class="alert alert-light text-center py-5">
        <h5>No jobs found matching your criteria.</h5>
        <p class="text-muted">Try searching with different keywords or clearing location filters.</p>
      </div>
    {% endfor %}
  </div>

</main>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indeed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212; /* Dark background to match the image theme */
    }

    /* Navbar Container */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      padding: 0 24px;
      background-color: transparent;
      color: #ffffff;
    }

    /* Left Section: Logo */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #ffffff;
    }

    .brand-logo .logo-text {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .brand-logo .logo-subtext {
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Right Section: Buttons & Links */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Action Buttons */
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-sign-in {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
    }

    .btn-sign-in:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .btn-post-job {
      background-color: #ffffff;
      color: #2d2d2d;
      border: 1px solid #ffffff;
    }

    .btn-post-job:hover {
      background-color: #f3f3f3;
    }

    .divider {
      width: 1px;
      height: 24px;
      background-color: rgba(255, 255, 255, 0.4);
      margin: 0 4px;
    }

    .jobseeker-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .jobseeker-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <!-- Left Side (Logo) -->
      <div class="nav-left">
        <a href="#" class="brand-logo">
          <span class="logo-text">indeed</span>
          <span class="logo-subtext">For Employers</span>
        </a>
      </div>

      <!-- Right Side (Moved here) -->
      <div class="nav-right">
        <a href="{% url 'employer_signup' %}" class="btn btn-sign-in">Sign up</a>
        <a href="{% url 'employer_signin' %}" class="btn btn-sign-in">Sign in</a>
        <a href="{% url 'empoyer_signin' %}" class="btn btn-post-job">Post a job</a>

        <div class="divider"></div>

        <a href="{% url 'jobportal'%}" class="jobseeker-link">For jobseekers</a>
      </div>
    </nav>
  </header>

</body>
</html>
